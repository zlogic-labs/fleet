apiVersion: v1
kind: Service
metadata:
  name: fleet-clickhouse
  labels:
    app: fleet-clickhouse
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  selector:
    app: fleet-clickhouse
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-clickhouse
spec:
  serviceName: fleet-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: fleet-clickhouse
  template:
    metadata:
      labels:
        app: fleet-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - containerPort: 8123
            - containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: fleet_detail
            - name: CLICKHOUSE_USER
              value: fleet
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-env
                  key: CLICKHOUSE_PASSWORD
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
